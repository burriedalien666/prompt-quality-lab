name: Bug 报告
description: 提交可以稳定复现的错误
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现相同问题
          required: true
        - label: 我提供的日志和样本已经脱敏
          required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际发生了什么，以及你原本期望什么。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 请提供可复制的命令和最小 JSONL 样本。
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 实际输出
      description: 粘贴完整错误信息或退出码，请删除密钥和隐私数据。
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 例如 0.1.0 或 git commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: 例如 3.11.9
    validations:
      required: true
