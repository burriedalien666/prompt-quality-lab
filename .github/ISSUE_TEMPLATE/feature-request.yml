name: 功能建议
description: 为具体评测场景提出可验证的改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前流程哪里不够用，不要只写功能名称。
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 最小示例
      description: 提供脱敏后的输入、期望输出或人工计算结果。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 怎样通过测试或命令确认这个功能已经完成？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 说明现有指标、脚本或工具为什么不能满足需求。
    validations:
      required: false
