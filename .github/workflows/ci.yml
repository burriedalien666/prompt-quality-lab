name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Offline quality and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install offline and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Check formatting
        run: |
          black --check src tests
          isort --check-only --profile black src tests
      - name: Run offline evaluator tests
        run: >-
          pytest
          tests/unit/test_quality.py
          tests/unit/test_quality_cli.py
          tests/unit/test_offline_import.py
          -q
      - name: Run multilingual quality gate
        run: >-
          pqlab evaluate
          examples/quality/candidate.jsonl
          --baseline examples/quality/baseline.jsonl
          --gate-metric character_f1
          --min-score 0.90
          --min-improvement 0
      - name: Build wheel
        run: python -m build --wheel

  full-tests:
    name: Full tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install full test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,optimize]"
      - name: Run full test suite
        env:
          PROMPT_OPS_TEST_ENV: "1"
        run: pytest tests -q
