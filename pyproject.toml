[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-quality-lab"
version = "0.1.0"
description = "Offline quality evaluation and regression gates for LLM outputs"
readme = "README.md"
authors = [{name = "burriedalien666"}]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["llm", "prompt", "evaluation", "quality-gate", "regression-testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
optimize = [
    "requests>=2.25.0",
    "dspy==3.2.1",
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    "pandas>=2.2.0",
    "litellm>=1.63.0",
]
dev = [
    "pytest>=8.3.0",
    "black>=25.1.0",
    "isort>=6.0.0",
    "mypy>=1.15.0",
    "tqdm>=4.67.0",
    "jsonschema>=4.23.0",
]

[project.scripts]
pqlab = "prompt_ops.interfaces.cli:cli"
prompt-ops = "prompt_ops.interfaces.cli:cli"

[project.urls]
Homepage = "https://github.com/burriedalien666/prompt-quality-lab"
Repository = "https://github.com/burriedalien666/prompt-quality-lab"
Issues = "https://github.com/burriedalien666/prompt-quality-lab/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["prompt_ops*"]

[tool.setuptools.package-data]
prompt_ops = ["templates/*.json", "templates/*.txt"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
